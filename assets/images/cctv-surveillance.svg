<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" fill="none">
  <defs>
    <linearGradient id="camBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="camDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006FFD"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="solarPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Panneau Solaire miniature (Caméra Solaire Autonome) -->
  <g filter="url(#dropShadow)" transform="translate(36, 26)">
    <polygon points="10,35 120,12 145,48 35,70" fill="url(#solarPanel)" stroke="#60A5FA" stroke-width="2"/>
    <line x1="38" y1="29" x2="62" y2="64" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <line x1="68" y1="23" x2="92" y2="58" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <line x1="98" y1="17" x2="122" y2="52" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <line x1="22" y1="52" x2="132" y2="30" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <rect x="74" y="58" width="10" height="26" rx="4" fill="#64748B"/>
  </g>

  <!-- Caméra IP 4K Bullet Pro (Gauche) -->
  <g filter="url(#dropShadow)" transform="translate(32, 95)">
    <!-- Support mural -->
    <rect x="8" y="45" width="16" height="58" rx="6" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M24 72 H55 L65 55 H34 Z" fill="#94A3B8"/>
    <!-- Corps caméra Bullet -->
    <g transform="rotate(8 110 55)">
      <rect x="48" y="18" width="136" height="64" rx="22" fill="url(#camBody)" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Visière pare-soleil -->
      <path d="M52 16 H192 C198 16 202 22 196 28 H48 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Bandeau bleu marque -->
      <rect x="92" y="38" width="44" height="16" rx="8" fill="#006FFD"/>
      <text x="114" y="49" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8.5" font-weight="800">4K IP</text>
      <!-- Objectif frontal ColorVu -->
      <circle cx="174" cy="50" r="26" fill="url(#camDark)" stroke="#475569" stroke-width="2"/>
      <circle cx="174" cy="50" r="14" fill="url(#lensGlow)"/>
      <circle cx="174" cy="50" r="6" fill="#0F172A"/>
      <circle cx="170" cy="46" r="2.5" fill="#FFFFFF" opacity="0.85"/>
      <!-- LEDs IR / ColorVu -->
      <circle cx="174" cy="30" r="2.2" fill="#FBBF24"/>
      <circle cx="174" cy="70" r="2.2" fill="#FBBF24"/>
      <circle cx="154" cy="50" r="2.2" fill="#EF4444"/>
    </g>
  </g>

  <!-- Dôme Motorisé PTZ 360° (Droite) -->
  <g filter="url(#dropShadow)" transform="translate(235, 38)">
    <!-- Bras de fixation -->
    <path d="M68 10 V36" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <!-- Coque supérieure -->
    <path d="M18 85 C18 46 118 46 118 85 Z" fill="url(#camBody)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="14" y="80" width="108" height="20" rx="8" fill="#006FFD"/>
    <text x="68" y="93" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="9" font-weight="800">PTZ 360° IA</text>
    <!-- Sphère optique noire -->
    <path d="M24 100 C24 162 112 162 112 100 Z" fill="url(#camDark)" stroke="#334155" stroke-width="2"/>
    <circle cx="68" cy="122" r="17" fill="url(#lensGlow)"/>
    <circle cx="68" cy="122" r="8" fill="#0F172A"/>
    <circle cx="63" cy="117" r="3" fill="#FFFFFF" opacity="0.9"/>
    <!-- Témoin Actif -->
    <circle cx="92" cy="110" r="3.5" fill="#10B981"/>
  </g>

  <!-- Badge Application Mobile Live 24/7 (Bas Centre) -->
  <g filter="url(#dropShadow)" transform="translate(115, 198)">
    <rect x="0" y="0" width="195" height="54" rx="16" fill="#0F172A" stroke="#006FFD" stroke-width="1.8"/>
    <circle cx="26" cy="27" r="7" fill="#10B981"/>
    <text x="44" y="23" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="800">LIVE MOBILE 24H/24</text>
    <text x="44" y="39" fill="#60A5FA" font-family="Inter, sans-serif" font-size="9.5" font-weight="600">Hikvision • Dahua • Solaire 4G</text>
  </g>
</svg>
